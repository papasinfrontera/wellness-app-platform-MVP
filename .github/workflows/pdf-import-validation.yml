name: Wellness platform validation
on:
  push:
    branches:
      - sprint-pdf-v2-1-layout-reconciliation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify PDF parser and safety
        run: |
          node --experimental-strip-types --test tests/pdf-v2-1-layout.test.mjs
          node --experimental-strip-types --test tests/pdf-v2-1-geometry.test.mjs
          npm run test:pdf
          npm run test:pdf-unmatched
          npm run test:pdf-reconcile
          npm run test:pdf-bulk
          node --test tests/pdf-document-history.test.mjs
          node --test tests/auth-identity-header.test.mjs
          node --test tests/login-profile-hub.test.mjs
          node --test tests/auth-k6-audit.test.mjs
          node --experimental-strip-types --test tests/lab-duplicate-corrections.test.mjs
          node --test tests/multiuser-admin-readonly.test.mjs
          node --test tests/multiuser-admin-actions.test.mjs
          node --test tests/admin-session-revocation.test.mjs
      - name: Install dependencies for TypeScript verification
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Type-check Next.js source
        run: npm run typecheck
      - name: Build Next.js without publishing to Vercel
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
